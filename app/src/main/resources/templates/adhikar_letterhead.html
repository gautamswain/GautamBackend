<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Adhikar Official Letter</title>
    <style>
        @page {
            size: A4;
            margin: 38mm 18mm 32mm 18mm;
            background-image: url("data:image/jpeg;base64,{{bgBase64}}");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 210mm 297mm;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: #111111;
        }
        .meta-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 10.5px;
        }
        .top-bar, .top-bar td, .header-row, .header-row td, .details-table, .details-table td, .signature-table, .signature-table td, .footer-bar, .footer-bar td, .footer-table, .footer-table td {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
        }
        .letter-body p {
            margin-bottom: 9px;
            line-height: 1.5;
            text-align: justify;
        }
        .letter-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
        }
        .letter-body th, .letter-body td {
            border: 1px solid #222222;
            padding: 5px 7px;
            font-size: 10.5px;
        }
    </style>
</head>
<body>
    {{qrTopRight}}
    {{headerBlock}}

    <div class="letter-body">
        {{formattedHtmlBody}}
    </div>

    {{secretCodeFooter}}
</body>
</html>
